<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SPREADSTER AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      gap: 12px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #1e293b;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo { font-size: 20px; font-weight: 700; color: #6366f1; letter-spacing: -0.5px; }
    .sub { font-size: 12px; color: #475569; }

    #error-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #f87171;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
      text-align: center;
      gap: 8px;
    }
    #error-view p { font-size: 13px; color: #94a3b8; }

    #app-frame {
      display: none;
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Loading state -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="logo">SPREADSTER</div>
    <div class="sub">Loading AI Assistant...</div>
  </div>

  <!-- Error state -->
  <div id="error-view">
    <div style="font-size:24px">⚠️</div>
    <strong>Failed to load SPREADSTER</strong>
    <p id="error-msg">Could not connect to the SPREADSTER app. Please check your configuration.</p>
    <p style="margin-top:8px;font-size:11px;color:#475569">
      Set SPREADSTER_APP_URL in Apps Script project settings.
    </p>
  </div>

  <!-- Main app iframe -->
  <iframe id="app-frame"
    allow="clipboard-write"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox">
  </iframe>

  <script>
    // The deployed React frontend URL (injected at deploy time via clasp / Apps Script properties)
    var APP_URL = '<?= PropertiesService.getScriptProperties().getProperty("SPREADSTER_APP_URL") || "https://spreadster.vercel.app" ?>';

    var frame = document.getElementById('app-frame');
    var loading = document.getElementById('loading');
    var errorView = document.getElementById('error-view');

    // Set iframe src
    frame.src = APP_URL;

    frame.onload = function() {
      loading.style.display = 'none';
      frame.style.display = 'block';
    };

    frame.onerror = function() {
      loading.style.display = 'none';
      errorView.style.display = 'flex';
      document.getElementById('error-msg').textContent =
        'Could not load: ' + APP_URL;
    };

    // Timeout fallback
    setTimeout(function() {
      if (frame.style.display !== 'block') {
        loading.style.display = 'none';
        frame.style.display = 'block';
      }
    }, 8000);

    // ============================================================
    // GAS ↔ iframe message bridge
    // The React app (inside iframe) communicates via window.postMessage
    // We relay the messages to google.script.run and back
    // ============================================================

    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data || !data.__spreadster) return;

      var action = data.action;
      var requestId = data.requestId;

      function sendBack(result, error) {
        var msg = { __spreadster: true, requestId: requestId, result: result, error: error };
        if (frame.contentWindow) {
          frame.contentWindow.postMessage(msg, '*');
        }
      }

      if (action === 'getSpreadsheetContext') {
        google.script.run
          .withSuccessHandler(function(ctx) { sendBack(ctx, null); })
          .withFailureHandler(function(err) { sendBack(null, err.message); })
          .getSpreadsheetContext();

      } else if (action === 'executeInstructionSet') {
        google.script.run
          .withSuccessHandler(function(result) { sendBack(result, null); })
          .withFailureHandler(function(err) { sendBack(null, err.message); })
          .executeInstructionSet(data.payload);

      } else if (action === 'applyRollback') {
        google.script.run
          .withSuccessHandler(function(result) { sendBack(result, null); })
          .withFailureHandler(function(err) { sendBack(null, err.message); })
          .applyRollback(data.payload);

      } else if (action === 'showToast') {
        google.script.run.showToast(data.message, data.title);
        sendBack({ ok: true }, null);
      }
    });

    // Inject helper into the React app's origin for direct google.script.run access
    // (only works when the app is served from the same origin, which won't be the case
    //  for Vercel deployments — postMessage bridge above is the primary mechanism)
  </script>

</body>
</html>
